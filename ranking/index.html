<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking de receptores judiciales | Receptores Chile</title><meta name="description" content="Ranking público de calidad de receptores judiciales en Chile según evaluaciones anónimas."><meta name="robots" content="index,follow"><link rel="canonical" href="https://receptores.vukusic.cl/ranking/"><style>
:root{color-scheme:light;--ink:#111;--muted:#666;--line:#ddd;--surface:#f7f7f7;--max:880px}
*{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#fff}
body{margin:0;line-height:1.55}a{color:inherit;text-underline-offset:3px}.shell{width:min(calc(100% - 32px),var(--max));margin-inline:auto}
header{border-bottom:1px solid var(--line)}.header-inner{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 0}
.brand{font-weight:700;text-decoration:none}.back{font-size:14px;color:var(--muted)}main{padding:52px 0 72px}.eyebrow{margin:0 0 8px;color:var(--muted);font-size:14px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-.03em;margin:0 0 14px}.lead{font-size:18px;color:#333;max-width:700px;margin:0 0 38px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}.section{padding:24px 0;border-bottom:1px solid var(--line);min-width:0}
.section:nth-child(odd){padding-right:28px}.section:nth-child(even){padding-left:28px;border-left:1px solid var(--line)}.section.full{grid-column:1/-1;padding-left:0;padding-right:0;border-left:0}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}p{margin:0}.contact-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}.empty{color:var(--muted)}
.notice{margin-top:32px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:#444}.meta{margin-top:24px;font-size:13px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:22px 0 40px;font-size:13px;color:var(--muted)}footer .shell{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
@media(max-width:650px){.header-inner{align-items:flex-start;flex-direction:column;gap:4px}main{padding-top:34px}.grid{display:block}.section,.section:nth-child(odd),.section:nth-child(even){padding:20px 0;border-left:0}}
.ranking{list-style:none;padding:0;margin:26px 0;border-top:1px solid var(--line)}.ranking li{display:grid;grid-template-columns:2fr 1fr .7fr .7fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:baseline}.ranking small{color:var(--muted)}.ranking-error{color:var(--muted)}@media(max-width:650px){.ranking li{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="shell header-inner"><a class="brand" href="/">Receptores Chile</a><a class="back" href="/">Buscador</a></div></header><main class="shell"><p class="eyebrow">Evaluaciones anónimas</p><h1>Ranking de calidad</h1><p class="lead">El orden pondera tanto la proporción de evaluaciones positivas como el tamaño de la muestra.</p><ul id="ranking" class="ranking"><li>Cargando ranking…</li></ul></main><footer><div class="shell"><span>Receptores Chile</span><a href="/">Volver al buscador</a></div></footer><script>window.RECEPTORES_TURNSTILE_SITE_KEY="0x4AAAAAAEkQy8FIbatMffjR";</script><script src="/ratings.js?v=20260901-2" defer></script><script>const API="https://receptores-analytics.adminbase100.workers.dev";fetch("/data/receptores.json").then(r=>r.json()).then(rows=>fetch(API+"/ratings/top?limit=100").then(r=>r.json()).then(data=>{const byId=new Map(rows.map(r=>[r.id,r]));const el=document.getElementById("ranking");el.replaceChildren(...(data.ratings||[]).map(item=>{const r=byId.get(item.receptor_id)||{};const li=document.createElement("li");li.innerHTML=`<span><a href="/receptores/${String(r.id||item.receptor_id).replace(/^rec-\d+-/,"")}.html">${r.nombre||item.receptor_id}</a></span><small>${r.corte||r.tribunal_fuente||"Adscripción no informada"}</small><span>${item.positive_pct}% positivas</span><span>${item.total} evaluaciones</span>`;return li}));if(!data.ratings?.length)el.innerHTML="Aún no hay receptores con 5 evaluaciones."})).catch(()=>document.getElementById("ranking").innerHTML="No fue posible cargar el ranking.");</script></body></html>
