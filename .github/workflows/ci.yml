name: CI

on:
  push:
    branches:
      - ux-redesign
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Worker tests
        run: npm test -- --run

  static-checks:
    name: Frontend static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check frontend JavaScript
        run: |
          node --check app-v4.js
          node --check ratings.js

      - name: Check SEO generator
        run: python -m py_compile tools/generate_seo_pages.py

  live-backend-smoke:
    name: Live Worker + D1 read smoke
    runs-on: ubuntu-latest

    steps:
      - name: Worker health
        run: |
          curl -fsS "https://receptores-analytics.adminbase100.workers.dev/health"
          echo

      - name: Read live ratings from D1 through Worker
        run: |
          curl -fsS \
            -H "Origin: https://receptores.vukusic.cl" \
            "https://receptores-analytics.adminbase100.workers.dev/ratings/top?limit=5"
          echo
